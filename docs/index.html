<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snake Game</title>
    <!-- Open the connection to the CheerpJ CDN while the page is still parsing -->
    <link rel="preconnect" href="https://cjrtnc.leaningtech.com" crossorigin />
    <link rel="preload" href="https://cjrtnc.leaningtech.com/4.2/loader.js" as="script" />
    <style>
      html, body { height: 100%; margin: 0; background: #f6efdc; color: #2f6b3a; font-family: Arial, sans-serif; }
      #display { position: fixed; inset: 0; }
      #status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: 8px; pointer-events: none; }
      #status h1 { margin: 0; font-size: 28px; }
      #status p { margin: 0; color: #6f6a55; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="display"></div>
    <div id="status">
      <h1>Snake Game</h1>
      <p id="message">Loading the Java runtime… the first load can take a minute.</p>
    </div>
    <script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
    <script>
      (async () => {
        const message = document.getElementById('message');
        try {
          await cheerpjInit({
            version: 8,
            // Saved files go to /files, which CheerpJ keeps in the browser between visits
            javaProperties: ['snake.dataDir=/files'],
          });
          // -1 × -1 fills #display, so the window's maximize button can use the whole page
          cheerpjCreateDisplay(-1, -1, document.getElementById('display'));
          document.getElementById('status').remove();
          // CheerpJ serves this site under /app, so build the jar's path from the page's own folder.
          // That works both locally (/app/SnakeGame.jar) and on GitHub Pages (/app/SnakeGame/SnakeGame.jar).
          const folder = location.pathname.replace(/[^/]*$/, '');
          await cheerpjRunMain('App', '/app' + folder + 'SnakeGame.jar');
        } catch (e) {
          message.textContent = 'The game failed to start: ' + e;
        }
      })();
    </script>
  </body>
</html>
